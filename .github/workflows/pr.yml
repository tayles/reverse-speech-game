name: PR

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the run in flight; nothing is published, so there is
# nothing to leave half-finished.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: latest

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # Formatting and lint in one step; `--format=github` turns any finding
      # into an annotation on the diff rather than a line buried in the log.
      - name: Check
        run: bun run check:ci

      # `build` runs `tsc -b` first, so this type-checks as well as bundling.
      - name: Build
        run: bun run build

      - name: Test
        run: bun run test:ci
