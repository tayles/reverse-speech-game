name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# deploy-pages publishes as the Pages app and mints an OIDC token to do it.
permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys rather than cancelling one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Check, build and publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: latest

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      # `build` runs `tsc -b` first, so this type-checks as well as bundling.
      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
