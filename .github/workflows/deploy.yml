name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# deploy-pages publishes as the Pages app and mints an OIDC token to do it.
permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys rather than cancelling one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Check, build and publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: latest

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # Formatting and lint in one step; `--format=github` turns any finding
      # into an annotation on the diff rather than a line buried in the log.
      - name: Check
        run: bun run check:ci

      # `build` runs `tsc -b` first, so this type-checks as well as bundling.
      - name: Build
        run: bun run build

      - name: Test
        run: bun run test:ci

      # Turns Pages on for the repo if it is not already, rather than failing
      # the run and making the first deploy a manual settings errand.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
